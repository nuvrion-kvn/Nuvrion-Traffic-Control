name: Проверка
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile nuvrion-traffic-control.py
      - run: sha256sum -c SHA256SUMS

  release:
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: traffic-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Публикация проверенной версии
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha256sum -c SHA256SUMS
          if gh release view "v$version" >/dev/null 2>&1; then
            if [[ "$COMMIT_MESSAGE" != *"[обновить-выпуск]"* ]]; then exit 0; fi
            git tag -f "v$version" "$GITHUB_SHA"
            git push --force origin "refs/tags/v$version"
            gh release edit "v$version" --title "Nuvrion Traffic Control $version" --notes-file RELEASE_NOTES.md
            gh release upload "v$version" --clobber nuvrion-traffic-control.py SHA256SUMS
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" \
            --title "Nuvrion Traffic Control $version" --notes-file RELEASE_NOTES.md \
            nuvrion-traffic-control.py SHA256SUMS
